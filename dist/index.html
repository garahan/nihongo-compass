<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="An adaptive Japanese placement test with a personal skill profile and study plan."><title>Nihongo Compass — Japanese placement test</title>
<meta name="theme-color" content="#f4f5fa"><link rel="icon" type="image/svg+xml" href="compass.svg"><link rel="stylesheet" href="style.css"><script defer src="bank.js"></script><script defer src="concepts.js"></script><script defer src="items-n5.js"></script><script defer src="items-n4.js"></script><script defer src="items-n3.js"></script><script defer src="items-n2.js"></script><script defer src="items-n1.js"></script><script defer src="transfer.js"></script><script defer src="engine.js"></script><script defer src="blueprint.js"></script><script defer src="session.js"></script><script defer src="app.js"></script></head>
<body>
<a class="skip-link" href="#app">Skip to assessment</a>
<header class="site-header"><div class="header-inner"><span class="brand"><img class="mark" src="compass.svg" width="40" height="40" alt="">Nihongo Compass</span><span class="header-label" id="stage">Japanese placement</span></div></header>
<main id="app" tabindex="-1"></main>
<template id="welcome">
<section class="welcome panel"><div class="welcome-copy">
  <p class="eyebrow">Japanese placement</p>
  <h1 tabindex="-1">Japanese level test</h1>
  <p>Get an initial estimate after 12 answers. Keep going to refine your level and find what to study next.</p>
  <ul class="levels" aria-label="Levels assessed"><li>N5</li><li>N4</li><li>N3</li><li>N2</li><li>N1</li></ul>
  <div class="actions"><button data-action="start">Start test <span aria-hidden="true"> →</span></button><button class="secondary" data-action="latest" hidden>View results</button><button class="secondary" data-action="transfer" hidden>Follow-up check</button></div>
  <small data-progress>Vocabulary, kanji readings and grammar · Progress saved on this device</small></div><ol class="route" aria-label="Assessment steps"><li><span>01</span><div><strong>Take the test</strong><small>Questions adapt to your answers.</small></div></li><li><span>02</span><div><strong>See your level</strong><small>Open results after 12 answers.</small></div></li><li><span>03</span><div><strong>Choose what to study</strong><small>Start with the skill that needs it most.</small></div></li></ol>
</section>
</template>
</body></html>
