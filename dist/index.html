<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="An adaptive Japanese placement test with a personal skill profile and study plan."><title>Nihongo Compass — Japanese placement test</title>
<link rel="stylesheet" href="style.css"><script defer src="bank.js"></script><script defer src="concepts.js"></script><script defer src="engine.js"></script><script defer src="blueprint.js"></script><script defer src="app.js"></script></head>
<body>
<a class="skip-link" href="#app">Skip to assessment</a>
<header class="site-header"><div class="header-inner"><span class="brand"><span class="mark" lang="ja" aria-hidden="true">日</span>Nihongo Compass</span><span class="header-label">Japanese placement</span></div></header>
<main id="app" tabindex="-1"></main>
<template id="welcome">
<section class="welcome panel">
  <p class="eyebrow">Adaptive assessment</p>
  <h1 tabindex="-1">Japanese level test</h1>
  <p>Get an initial estimate after 12 answers. Keep going to refine your level and find what to study next.</p>
  <ul class="levels" aria-label="Levels assessed"><li>N5</li><li>N4</li><li>N3</li><li>N2</li><li>N1</li></ul>
  <div class="actions"><button data-action="start">Start test <span aria-hidden="true"> →</span></button><button class="secondary" data-action="latest" hidden>View results</button></div>
  <small data-progress>Vocabulary, kanji readings and grammar · Progress saved on this device</small>
</section>
</template>
</body></html>
