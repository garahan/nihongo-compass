<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="An adaptive Japanese placement test with a personal skill profile and study plan."><title>Nihongo Compass — Japanese placement test</title>
<style>
:root{color-scheme:light;--ink:#17221e;--muted:#506059;--line:#d7dfda;--accent:#145540}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#fff;font:16px/1.55 system-ui,sans-serif}
header,main{max-width:700px;margin:auto;padding:16px 22px}header{border-bottom:1px solid var(--line);font-weight:700}main{padding-top:25px;padding-bottom:48px}
h1,h2,h3,p{margin:0 0 12px}h1{font-size:1.6rem;line-height:1.35}h2{font-size:1.2rem}h3{font-size:1rem}p,small,.eyebrow{color:var(--muted)}small{display:block;margin-top:10px}.eyebrow{font-size:.88rem}
button{font:inherit;cursor:pointer;font-weight:650;border:1px solid transparent;border-radius:7px;padding:10px 14px;background:var(--accent);color:#fff}
.secondary{background:#fff;color:var(--accent);border-color:var(--line)}button:disabled{cursor:default}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--accent)}
.spread,.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{justify-content:space-between;margin-bottom:12px}.actions{margin-top:18px}.jp{font-size:clamp(1.15rem,4vw,1.5rem);overflow-wrap:anywhere}.options{display:grid;gap:8px}.option{text-align:left;background:white;color:var(--ink);border-color:var(--line);min-height:46px}.option:not(:disabled):hover{background:#f4f8f5}
.right{background:#edf7ee;border-color:#7ba387}.wrong{background:#fff0ed;border-color:#bc8d83}.feedback{margin:14px 0 0}
.reportgrid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px;margin:20px 0}.reportgrid svg{width:100%;max-height:220px}.reporthero,.panel+.panel,.reportgrid{border-top:1px solid var(--line);padding-top:16px}.bar{display:grid;grid-template-columns:1fr auto;gap:3px 12px;margin:9px 0;font-size:.88rem}.bar progress{width:100%;height:7px;grid-column:1/-1;accent-color:var(--accent)}.tile,details{border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer}details p{margin-top:8px}.grid{margin-top:14px}
[hidden]{display:none!important}@media(max-width:550px){.reportgrid{grid-template-columns:1fr}header,main{padding-left:16px;padding-right:16px}}
</style><script defer src="bank.js"></script><script defer src="app.js"></script></head>
<body><header>Japanese placement</header><main id="app"></main>
<template id="welcome"><h1 tabindex="-1">Japanese level test</h1><p>Answer 12 questions for a first estimate. Keep going to refine your level and study plan.</p><div class="actions"><button data-action="start">Start test</button><button class="secondary" data-action="latest" hidden>View results</button></div><small>Vocabulary, kanji readings and grammar.</small></template></body></html>
